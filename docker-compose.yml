version: '3.8'

services:
  web:
    build: .
    container_name: vahad_tms_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-local-docker-dev-secret-key-3849102840}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - DATABASE_URL=postgresql://vahad_user:vahad_password@db:5432/vahad_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  db:
    image: postgres:16-alpine
    container_name: vahad_tms_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vahad_db
      - POSTGRES_USER=vahad_user
      - POSTGRES_PASSWORD=vahad_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vahad_user -d vahad_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
  static_data:
